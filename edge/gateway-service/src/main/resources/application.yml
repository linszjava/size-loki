server:
  port: ${SERVER_PORT:8088}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          routes:
            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
            - id: inventory
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ${LOG_FILE:./logs/gateway-service.json}
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: 1.0.0-SNAPSHOT
        environment: local
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:./logs/gateway-service.json}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB