server:
  port: ${SERVER_PORT:18082}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: inventory-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ${LOG_FILE:./logs/inventory-service.json}
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: 1.0.0-SNAPSHOT
        environment: local
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:./logs/inventory-service.json}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB